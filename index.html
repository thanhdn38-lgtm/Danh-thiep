<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Đặng Ngọc Thành - Danh thiếp điện tử</title>
<style>
  :root{
    --bg:#002B69;
    --bg-light:#0a3a82;
    --text:#ffffff;
    --accent:#8fb8ff;
    --muted:rgba(255,255,255,0.72);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  }
  body{
    background:linear-gradient(160deg,var(--bg) 0%, var(--bg-light) 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  .card{
    width:100%;
    max-width:380px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:24px;
    padding:36px 28px 30px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    backdrop-filter:blur(6px);
  }
  .avatar-wrap{
    width:128px;
    height:128px;
    margin:0 auto 20px;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(135deg,var(--accent),#ffffff33);
  }
  .avatar{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid var(--bg);
  }
  .avatar-fallback{
    width:100%;
    height:100%;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg-light);
    font-size:48px;
    font-weight:700;
    color:var(--text);
    border:3px solid var(--bg);
  }
  h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.3px;
    margin-bottom:6px;
  }
  .title{
    font-size:15px;
    color:var(--accent);
    font-weight:600;
    margin-bottom:2px;
  }
  .org{
    font-size:13px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .tagline{
    font-size:14px;
    line-height:1.6;
    color:var(--muted);
    font-style:italic;
    padding:14px 10px;
    border-top:1px solid rgba(255,255,255,0.15);
    border-bottom:1px solid rgba(255,255,255,0.15);
    margin-bottom:22px;
  }
  .tagline .quote-author{
    display:block;
    margin-top:6px;
    font-style:normal;
    font-size:12px;
    color:var(--accent);
    font-weight:600;
  }
  .contact-list{
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:26px;
  }
  .contact-item{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
  }
  .contact-item .icon{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
  }
  .contact-item a{
    color:var(--text);
    text-decoration:none;
    word-break:break-all;
  }
  .save-btn{
    width:100%;
    padding:14px 20px;
    border:none;
    border-radius:14px;
    background:var(--text);
    color:var(--bg);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:transform 0.15s ease, opacity 0.15s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .save-btn:active{
    transform:scale(0.97);
    opacity:0.9;
  }
</style>
</head>
